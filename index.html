<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<!-- '홈 화면에 추가'로 열면 주소창 없이 전체 화면 (화면 방향은 폰 따라 회전) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pebbly Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 한글: Paperlogy (기하학적 산세리프, Orbitron 숫자와 결을 맞춤). 없는 글자는 Pretendard로 대체 */
@font-face{font-family:Paperlogy;font-weight:200;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2) format('woff2')}
@font-face{font-family:Paperlogy;font-weight:300;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2) format('woff2')}
@font-face{font-family:Paperlogy;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2) format('woff2')}
@font-face{font-family:Paperlogy;font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2) format('woff2')}
@font-face{font-family:Paperlogy;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2) format('woff2')}

/* 1rem = 디자인 단위. 세로 화면은 100×160, 가로 화면은 160×100 단위로 설계하고
   어떤 화면 비율이든 이 캔버스가 들어가도록 맞춤 (남는 공간은 가운데 거울 영역으로) */
html{font-size:min(1vw, .625vh)}
@media (orientation: landscape){ html{font-size:min(.625vw, 1vh)} }

:root{
  --bg:#000;
  --text:#fff;
  --text-muted:#a3a3a3;
  --text-dim:#5f5f5f;
  --line:#1c1c1c;
  --grid:#101010;
  --card-bd:#262626;
  --rain:#8ec5ff;
  --sunrise:#ffb35c;
  --sunset:#8ec5ff;
  /* 대기질 등급색 (환경부 4단계) */
  --good:#6cb8ff;
  --normal:#6fdc9a;
  --bad:#ffb057;
  --worst:#ff6b6b;
  /* 날짜: 토요일 하늘색, 일요일·공휴일 핑크 */
  --sat:#7cc8ff;
  --sun:#ff8fb8;
  --num:"Orbitron","Pretendard Variable",Pretendard,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
/* 터치는 JS가 직접 처리(밀어서 위젯 넘기기·두 번 탭 설정) — 확대·당겨서 새로고침 막음 */
html,body{touch-action:none;overscroll-behavior:none}
/* 마우스가 멈춰 있으면 커서를 숨김 (거울 너머로 화살표가 비치지 않게). 움직이면 다시 보임 */
body.idle, body.idle *{cursor:none}
body{
  font-family:Paperlogy,"Pretendard Variable",Pretendard,system-ui,"Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  word-break:keep-all;
}

/* ── 무대: 세로 배치 ── */
.stage{
  position:fixed;inset:0;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-rows:auto auto auto auto auto 1fr auto auto;
  grid-template-areas:
    "head   head"
    "clock  clock"
    "date   hero"
    "wstats wstats"
    "cards  cards"
    "zone   zone"
    "wave   wave"
    "phrase phrase";
  column-gap:4rem;
  padding:5rem 6.5rem;
  /* 레퍼런스의 타일 격자. 거울 너머로는 거의 안 보일 만큼 어둡게 */
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:12.5rem 12.5rem;
  transition:opacity 3s;
}
body.night .stage{opacity:.45}
.zone{grid-area:zone}

.lbl{font-family:var(--num);font-weight:500;font-size:2rem;color:var(--text-dim);letter-spacing:.06em;text-transform:lowercase}
.card{display:flex;flex-direction:column;border:1px solid var(--card-bd);border-radius:2.6rem;background:linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));padding:2rem 2.2rem}

/* 아이콘: 흰 선 아이콘. .occ는 뒤에 있는 해/달을 가리는 구름 */
.ico{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.ico .occ{fill:var(--bg)}
.ico .dots{stroke-width:2.6}

/* ── 헤더 ── */
.head{grid-area:head;display:flex;align-items:center;justify-content:space-between;padding-bottom:3rem;margin-bottom:3rem;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:1.6rem;font-family:var(--num);font-weight:700;font-size:2.6rem;letter-spacing:.08em}
.brand svg{width:3.4rem;height:3.4rem;fill:currentColor}
.head-r{display:flex;align-items:center;gap:2.4rem;font-size:2.3rem;color:var(--text-dim)}
.head-r .ico{width:2.6rem;height:2.6rem;color:var(--text-muted)}
.loc{display:flex;align-items:center;gap:1rem}
.menu{display:grid;grid-template-columns:repeat(2,.8rem);gap:.6rem}
.menu i{width:.8rem;height:.8rem;border-radius:50%;background:var(--text-muted)}

/* ── 숫자 롤러: 값이 바뀌면 세로로 굴러 올라감 ── */
.roll{--lh:1em;display:inline-block;height:var(--lh);overflow:hidden;vertical-align:top;text-align:center}
.strip{display:block;transform:translateY(calc(var(--p, 0) * -1 * var(--lh)));transition:transform .6s cubic-bezier(.2,.75,.2,1)}
.strip span{display:block;height:var(--lh);line-height:var(--lh)}
/* 초: 위아래로 이전·다음 숫자가 살짝 보이는 롤러 */
.roll.peek{height:calc(var(--lh) * 1.7);-webkit-mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent);mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent)}
.roll.peek .strip{transform:translateY(calc((var(--p, 0) * -1 + .35) * var(--lh)))}
/* Orbitron 숫자는 높이 .72em·내림 0 → 줄 높이 .82em이면 잘리지 않으면서 위아래 여백이 거의 없음 */
.clock .roll{--lh:.82em}

/* ── 시계: 시·분·초 한 줄. 1행 라벨 / 2행 숫자, 칸 너비에 맞춰 JS가 --clock 크기를 계산 ── */
.clock{grid-area:clock;min-width:0;padding-bottom:5.5rem}
/* 세로: 양 끝을 아래 내용 폭에 맞춤. 크기는 가장 넓은 시각 기준이라 좁은 숫자('1' 등)일 때 남는 폭은 시·분·초 사이 간격으로 */
.clock-in{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;align-items:end;width:100%;font-family:var(--num);font-weight:900;font-size:var(--clock, 20rem);line-height:.82}
.clock .lbl{margin-bottom:2.4rem;line-height:1.2}
/* 숫자마다 폭이 달라서('1'은 '0'의 절반) 칸 폭을 숫자에 맞추고 바뀔 때 부드럽게 늘고 줄게 함 */
.clock .roll{width:.834em;transition:width .6s cubic-bezier(.2,.75,.2,1)}
.colon{height:.82em;line-height:.82em;margin:0 .04em;color:var(--text-muted)}
/* 초: 시·분의 40% 크기. 현재 숫자의 바닥을 시·분 바닥에 맞추고 다음 숫자는 그 아래로 살짝 비침 */
.sgroup{display:flex;align-items:flex-end;font-size:.4em;margin-bottom:calc(-.35 * .82em)}
.sgroup .colon{margin:0 .12em calc(.35 * .82em) .1em}
.sgroup .roll{width:1.67em;text-align:left;transition:none}
.lbl-s{padding-left:.6rem}

.date{grid-area:date;align-self:center}
.date-num{font-family:var(--num);font-weight:700;font-size:6.4rem;line-height:1;letter-spacing:.02em}
.date-day{margin-top:1.4rem;font-size:3rem;font-weight:600;color:var(--text-muted)}
/* 토요일 하늘색, 일요일·공휴일 핑크 (body[data-day]는 JS가 정함) */
body[data-day="sat"] #date-wd{color:var(--sat)}
body[data-day="sun"] #date-wd{color:var(--sun)}
/* 시계 강조 화면용 날짜 (.ds): 시계 오른쪽에 눕혀서(아래→위로 읽힘) 날짜는 아래 끝, 요일은 위 끝 */
.ds{display:none}
.ds-date{font-size:3.4rem;font-weight:600;line-height:1;white-space:nowrap;color:var(--text-muted)}
.ds-date b{margin:0 .5rem 0 1.4rem;font-family:var(--num);font-weight:700;font-size:6.4rem;color:var(--text)}
.ds-date b:first-child{margin-left:0}
/* 요일(+공휴일 이름)은 반대쪽 끝(위)으로 */
.ds .ds-wd{margin-inline-start:auto;font-size:5rem;font-weight:700;line-height:1}
.ds .ds-hol{font-size:3.2rem;font-weight:600;line-height:1;color:var(--sun)}
.ds .ds-hol:empty{display:none}
body[data-day="sat"] .ds-wd{color:var(--sat)}
body[data-day="sun"] .ds-wd{color:var(--sun)}

/* ── 현재 날씨 ── */
/* 세로: wmain을 풀어서 기온(날짜 옆)과 정보 줄(전체 너비)을 각각 배치. 가로에선 한 덩어리 */
.wmain{grid-area:wmain;min-width:0;display:contents}
/* 큰 기온 | 설명 — 가는 세로선으로 나눈 매거진식 구성 */
.w-hero{grid-area:hero;justify-self:end;display:flex;align-items:center;gap:3.2rem}
.w-temp{flex:none;font-size:15rem;font-weight:200;line-height:.85;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 35%,#7d7d7d);-webkit-background-clip:text;background-clip:text;color:transparent}
.w-desc{min-width:0;padding-left:3.2rem;border-left:1px solid #2a2a2a}
.w-title{display:flex;align-items:center;gap:1.4rem;font-size:4.8rem;font-weight:400;line-height:1.15;letter-spacing:-.02em}
.w-title .ico{width:4.4rem;height:4.4rem;flex:none}
.w-sub{margin-top:.6rem;font-size:2.6rem;font-weight:300;color:var(--text-muted)}
.w-title + .w-sub{margin-top:1.4rem}
/* 최고·최저·습도·자외선 카드 4장 */
.w-stats{grid-area:wstats;margin-top:4.5rem;display:grid;grid-template-columns:repeat(4,1fr);gap:2rem}

/* ── 카드: 미세먼지·초미세먼지·일출일몰 ── */
.cards{grid-area:cards;display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:2rem;margin-top:2rem}
/* 숫자 카드 공통: 이름 / 큰 값 / 맨 아래 보조 정보(등급·시각 등) */
.c-name{font-size:2.4rem;color:var(--text-muted)}
.c-val{margin-top:1rem;font-size:5.2rem;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-sub{margin-top:auto;padding-top:1rem;font-size:2.4rem;font-weight:600;color:var(--text-muted);white-space:nowrap}
.good{color:var(--good)} .normal{color:var(--normal)} .bad{color:var(--bad)} .worst{color:var(--worst)}

.sun-times{display:flex;justify-content:space-between;font-size:2.3rem;color:var(--text-muted)}
.sun-times b{display:block;font-weight:500;font-size:2.8rem;color:var(--text);font-variant-numeric:tabular-nums}
.sun-times div:last-child{text-align:right}
.sun-arc{display:block;width:100%;margin-top:-2rem;overflow:visible}
.sun-arc .arc{fill:none;stroke:#555;stroke-width:.6;stroke-dasharray:.4 2.2;stroke-linecap:round}
.sun-arc .arc-done{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.7}
.sun-arc .horizon{stroke:#2e2e2e;stroke-width:.5}
.sun-arc .half{fill:none;stroke:var(--text-muted);stroke-width:.8;stroke-linecap:round}
.sun-arc .sun{fill:#fff;filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 3px rgba(255,224,138,.9))}
/* 달 모양: 오늘 위상(초승·상현·보름 …)과 밝은 비율 */
.moon{display:flex;align-items:center;gap:1rem;margin-top:1.2rem;font-size:2.3rem;color:var(--text-muted)}
.moon-ico{width:3rem;height:3rem;flex:none}
.moon-bg{fill:#262626}
.moon-lit{fill:#f4efd9}
.moon-pct{margin-left:auto;color:var(--text-dim);font-variant-numeric:tabular-nums}

/* ── 예보 곡선 ── */
.wave{grid-area:wave;--n:6}
.wave-row{display:grid;grid-template-columns:repeat(var(--n),1fr);text-align:center}
.wd{display:block;font-size:2.4rem;color:var(--text-muted)}
.wt b{display:block;margin-top:.6rem;font-size:4.4rem;font-weight:300;line-height:1.1;font-variant-numeric:tabular-nums}
.wt small{font-size:.5em;color:var(--text-dim);margin-left:.35em}
.wt.past .wd, .wt.past b{color:var(--text-dim)}
.wt.today .wd{color:var(--text);font-weight:600}
.wt.today b{text-shadow:0 0 2rem rgba(255,255,255,.45)}
.wave-plot{position:relative;height:11rem;margin-top:1.4rem}
.wave-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:5.4rem;height:5.4rem;transform:translate(-50%,-50%);border:1px solid #2c2c2c;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.node .ico{width:3rem;height:3rem}
.node.past{opacity:.45}
.wave-dot{position:absolute;width:1.8rem;height:1.8rem;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 1.4rem .5rem rgba(255,255,255,.55),0 0 4.5rem 1.8rem rgba(255,255,255,.18)}
.wave-line{position:absolute;top:-1.2rem;border-left:1px dashed rgba(255,255,255,.4)}
.wp{font-size:2.2rem;color:var(--rain);min-height:1.4em;margin-top:.6rem}
.f-lbl{margin-bottom:1.8rem}

/* ── 시간별 예보: 기온 영역 그래프 + 강수확률 막대 ── */
.hourly{grid-area:wave;--n:12}
.h-row{display:grid;grid-template-columns:repeat(var(--n),1fr);text-align:center}
.ht{display:flex;flex-direction:column;align-items:center;gap:.9rem}
.hl{font-size:2.2rem;color:var(--text-muted);white-space:nowrap}
.ht .ico{width:3rem;height:3rem}
.ht b{font-size:3rem;font-weight:300;font-variant-numeric:tabular-nums}
.ht.now .hl{color:var(--text);font-weight:600}
.h-plot{position:relative;height:6.5rem;margin-top:1.4rem}
.h-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.h-dot{position:absolute;width:.9rem;height:.9rem;transform:translate(-50%,-50%);border-radius:50%;background:#fff}
.h-dot.now{width:1.6rem;height:1.6rem;box-shadow:0 0 1.2rem .4rem rgba(255,255,255,.5)}
.h-bars{margin-top:1.2rem}
.hb{display:flex;flex-direction:column;align-items:center}
.bar{width:1.2rem;height:2.6rem;display:flex;align-items:flex-end;border-radius:.6rem;overflow:hidden}
.bar i{display:block;width:100%;border-radius:.6rem;background:var(--rain)}
.bar.dry i{background:#262626}
.hb span{margin-top:.5rem;font-size:1.9rem;color:var(--rain);min-height:1.3em}

/* 세로: 같은 자리에서 시간별 ↔ 일별을 번갈아 표시 (body.alt = 일별) */
.wave,.hourly{transition:opacity 1.2s}
body:not(.alt) .wave{opacity:0}
body.alt .hourly{opacity:0}

/* ── 문구 ── */
.phrase{grid-area:phrase;margin-top:3.5rem;font-size:4.6rem;font-weight:700;line-height:1.3;letter-spacing:-.01em;transition:opacity 1.2s}
.phrase.fade{opacity:0}

/* ── 가로 배치: 왼쪽 시계 / 오른쪽 날씨, 아래 예보 곡선과 카드 ── */
@media (orientation: landscape){
  .stage{
    grid-template-columns:minmax(0,1fr) minmax(0,.82fr);
    grid-template-rows:auto auto auto auto 1fr auto;
    grid-template-areas:
      "head   head"
      "clock  wmain"
      "date   wave"
      "phrase wave"
      "zone   zone"
      "hourly cards";
    column-gap:6rem;
    padding:4rem 6rem;
  }
  .head{padding-bottom:2rem;margin-bottom:2rem}
  .clock-in{width:max-content}
  .clock{align-self:end;padding-bottom:3rem}
  .date{align-self:start}
  .date-num{font-size:5.4rem}
  .phrase{align-self:start;margin-top:2.4rem;font-size:3rem;font-weight:400;line-height:1.5;color:var(--text-muted)}
  .wmain{display:block;align-self:end;padding-bottom:2rem}
  .w-temp{font-size:11rem}
  .w-stats{margin-top:2.4rem;gap:1.6rem}
  .w-stats .card{padding:1.4rem 1.8rem}
  .w-stats .c-name, .w-stats .c-sub{font-size:2.1rem}
  .w-stats .c-val{margin-top:.6rem;font-size:4rem}
  .w-stats .c-sub{padding-top:.6rem}
  .f-lbl{margin-bottom:1.2rem}
  /* 가로는 시간별·일별을 둘 다 표시. 오른쪽 칸(약 64단위)에 6일이 들어가도록 예보를 조금 줄임 */
  .wave,.hourly{opacity:1 !important}
  .hourly{grid-area:hourly;align-self:end}
  .wave{margin-top:2rem}
  .wt b{font-size:3.6rem}
  .wave-plot{height:7rem;margin-top:1.2rem}
  .node{width:4.6rem;height:4.6rem}
  .node .ico{width:2.6rem;height:2.6rem}
  .hl{font-size:2rem}
  .ht .ico{width:2.6rem;height:2.6rem}
  .ht b{font-size:2.8rem}
  .h-plot{height:4.4rem;margin-top:1rem}
  .h-bars{margin-top:.8rem}
  .bar{height:2rem}
  .hb span{font-size:1.7rem}
  .cards{margin-top:0;align-self:end}
  .sun-times{font-size:2rem}
  .sun-times b{font-size:2.4rem}
  .sun-arc{margin-top:.6rem}
}

/* ── 시계 강조 (기본. ?mode=detail이면 위의 상세 화면): 멀리서도 보이게 시·분·초를 세로로 쌓은 큰 시계
   + 날씨 위젯 하나가 10초마다 바뀜 (지금 날씨 → 시간별 → 일별 → 공기·해)
   가로는 왼쪽 시계(+날짜) | 오른쪽 위젯, 세로는 위 시계(+날짜) / 아래 위젯 ── */
.sb-dots{display:none}
/* 시계 칸은 내용 폭(크기는 fitClock이 위젯 자리를 남기고 맞춤), 남는 폭은 위젯 */
body.sb .stage{
  grid-template-columns:auto minmax(0,1fr);
  grid-template-rows:1fr auto 1fr;
  grid-template-areas:
    ".     panel"
    "clock panel"
    ".     panel";
  column-gap:2.4rem;
  padding:5rem max(9rem, calc(env(safe-area-inset-right) + 5.5rem)) 5rem max(7rem, env(safe-area-inset-left));
  transition:opacity 3s, filter 3s, transform 2s;
}
body.sb .head, body.sb .zone, body.sb .phrase{display:none}
body.sb .clock{position:relative;padding-bottom:6rem}

/* 시계 쪽 기능 (스톱워치·타이머·알람): 시계 자리에 같은 크기 3줄로 겹쳐 보임.
   줄마다 라벨 | 숫자 | +·− 버튼, 셋째 줄 왼쪽에 이름과 시작·초기화 버튼 */
.cm{display:none}
body.sb[data-cm="sw"] #cm-sw, body.sb[data-cm="tm"] #cm-tm, body.sb[data-cm="al"] #cm-al{display:grid}
body.sb:not([data-cm="clock"]) #clock-in{visibility:hidden}
.cm{position:absolute;inset:0 0 6rem;grid-template-columns:auto auto 1fr;grid-template-rows:auto auto 1fr;
  grid-template-areas:"l1 d1 c1" "l2 d2 c2" "ft ft .";align-items:end;column-gap:2rem;row-gap:.04em;
  font-family:var(--num);font-weight:900;font-size:var(--clock);line-height:.82}
.cm b{display:flex;height:.82em}
/* 숫자 칸 폭을 고정해서 빨리 바뀌어도 흔들리지 않게 */
.cm b i{display:inline-block;width:var(--dw, .834em);text-align:center;font-style:normal}
.cm .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:2.6rem;line-height:1}
.cm-l1{grid-area:l1} .cm-l2{grid-area:l2} .cm-d1{grid-area:d1} .cm-d2{grid-area:d2}
/* 셋째 줄 숫자(1/100초)는 시계의 초처럼 숫자 칸 오른쪽 끝, 절반 크기 */
.cm-d3{grid-row:3;grid-column:2;justify-self:end;font-size:.5em}
.cm-c1{grid-area:c1} .cm-c2{grid-area:c2}
.cm-pm{display:flex;flex-direction:column;gap:1.4rem;align-self:center;justify-self:start}
.cm-foot{grid-area:ft;align-self:end;display:flex;flex-direction:column;gap:1.6rem;font-size:2.6rem}
.cm-name{font-family:var(--num);font-weight:500;color:var(--text-dim);letter-spacing:.06em;line-height:1}
.cm-ctl{display:flex;gap:1.4rem}
.cm button{font-family:Paperlogy,"Pretendard Variable",Pretendard,sans-serif;font-weight:600;font-size:3.2rem;line-height:1;
  color:var(--text);background:none;border:1px solid var(--card-bd);border-radius:999px;padding:1.6rem 3rem;cursor:pointer;white-space:nowrap}
.cm-pm button{width:7rem;height:7rem;padding:0;font-size:4.4rem}
.cm button.on{background:#fff;color:#000;border-color:#fff}
/* 울림 */
.ring{position:fixed;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:5rem;background:rgba(0,0,0,.85);animation:ring 1s steps(2) infinite}
.ring[hidden]{display:none}
@keyframes ring{50%{background:rgba(255,255,255,.22)}}
.ring b{font-family:var(--num);font-size:9rem;font-weight:900}
.ring button{font:inherit;font-size:4.4rem;font-weight:700;padding:2.4rem 7rem;border:0;border-radius:999px;background:#fff;color:#000}
/* 세로 라벨 | 숫자 — 시 / 분 / 초(절반 크기) 3줄. 크기는 JS(fitClock)가 칸 폭·남는 높이에 맞춤 */
body.sb .clock-in{width:100%;grid-template-columns:auto auto 1fr;grid-template-areas:"lh hh ds" "lm mm ds" ". ss ds";justify-content:start;column-gap:2rem;row-gap:.04em}
body.sb #lbl-h{grid-area:lh} body.sb #lbl-m{grid-area:lm}
body.sb #hh{grid-area:hh} body.sb #mm{grid-area:mm}
body.sb #lbl-gap, body.sb #colon, body.sb .sgroup .colon{display:none}
body.sb .clock .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:2.6rem;line-height:1;margin:0;padding:0}
/* 초 줄: 숫자는 오른쪽 끝(시·분 끝선), 라벨은 왼쪽 끝(시·분 시작선)에 가로로 — 양 끝을 위 숫자에 맞춤 */
body.sb .clock #lbl-s{grid-area:ss;justify-self:start;writing-mode:horizontal-tb;transform:none}
/* 초: 위아래로 비치는 이웃 숫자는 줄 높이에 넣지 않고 위 여백·시계 아래 여백으로 넘치게 둠 */
body.sb .sgroup{grid-area:ss;justify-self:end;font-size:.5em;margin:.24em 0 0}
body.sb .sgroup .roll{margin:calc(-.35 * var(--lh)) 0;text-align:center}
/* 날짜: 시계 오른쪽 칸(오른쪽 끝)에 시 숫자 위 끝 ~ 초 숫자 아래 끝 높이로 눕힘 (시·분 라벨과 같은 방향) */
body.sb #date{display:none}
body.sb .ds{grid-area:ds;display:flex;align-items:center;gap:2rem;align-self:stretch;justify-self:end;margin-left:3rem;
  writing-mode:vertical-rl;text-orientation:sideways;transform:rotate(180deg)}

/* 위젯 4개(교통을 등록하면 5개)가 같은 자리에 겹쳐 있고 data-panel 차례인 것만 보임 */
body.sb .wmain, body.sb .hourly, body.sb .wave, body.sb .cards, body.sb .transit{
  grid-area:panel;align-self:center;margin:0 0 0 4rem;padding:0;
  opacity:0 !important;transform:translateY(3rem);transition:opacity .9s, transform .9s;
}
body.sb[data-panel="0"] .wmain, body.sb[data-panel="1"] .hourly,
body.sb[data-panel="2"] .wave, body.sb[data-panel="3"] .cards,

/* 교통 위젯: 등록한 정류장·역마다 이름 / 노선별 도착까지 남은 시간 */
.transit{display:none}

.tr-item{padding:2rem 0;border-top:1px solid var(--line)}

.tr-head{font-size:3.2rem;font-weight:600;color:var(--text-muted)}

body.sb .wmain{display:block}
body.sb .wmain::before, body.sb .cards::before{display:block;font-family:var(--num);font-weight:500;font-size:2.6rem;line-height:1.2;color:var(--text-dim);letter-spacing:.06em;margin-bottom:2.6rem}

/* 정보 카드 2×2. 카드 안은 이름·보조 정보(왼쪽) | 값(오른쪽) */

/* 위젯 칸이 좁을 때(태블릿 가로 등): 기온·설명을 줄이고 정보 카드는 이름 / 값 / 보조 세로형으로 */
body.sb .wmain, body.sb .wave{container-type:inline-size}
@container (max-width: 64rem){
  body.sb .wd{font-size:2.8rem}
  body.sb .wt b{font-size:3.4rem}
  body.sb .wp{font-size:2.5rem}
  body.sb .w-hero{gap:2.4rem}
  body.sb .w-temp{font-size:15rem}
  body.sb .w-desc{padding-left:2.4rem}
  body.sb .w-title{font-size:4.6rem}
  body.sb .w-sub{font-size:2.9rem}
  body.sb .w-stats .card{display:flex;padding:1.8rem 2.2rem}
  body.sb .w-stats .c-val{margin-top:.8rem;font-size:6rem}
  body.sb .w-stats .c-sub{margin-top:auto;padding-top:.8rem}
}

body.sb .ht{gap:1.4rem}

body.sb .ht b{font-size:4.8rem}
body.sb .h-plot{height:12rem;margin-top:2.4rem}
body.sb .h-dot{width:1.3rem;height:1.3rem}
body.sb .h-dot.now{width:2.4rem;height:2.4rem}
body.sb .h-bars{margin-top:2.4rem}
body.sb .bar{width:2rem;height:4.4rem;border-radius:1rem}

body.sb .wd{font-size:3.2rem}
body.sb .wt b{margin-top:1rem;font-size:4.2rem}
body.sb .wave-plot{height:14rem;margin-top:2.4rem}

body.sb .cards{grid-template-columns:1fr 1fr;gap:2.4rem}

/* 일출 시각 | 반원 | 일몰 시각 */
body.sb .sun-card{grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;column-gap:3rem}

/* 위젯 위치 표시 (아이폰 스마트 스택처럼 오른쪽 세로 점) */
body.sb .sb-dots{position:absolute;top:50%;right:max(3rem, env(safe-area-inset-right));transform:translateY(-50%);display:flex;flex-direction:column;gap:1.2rem}
.sb-dots i{width:1.2rem;height:1.2rem;border-radius:.6rem;background:#333;transition:height .6s, background .6s}
body[data-panel="0"] .sb-dots i:nth-child(1), body[data-panel="1"] .sb-dots i:nth-child(2),
body[data-panel="2"] .sb-dots i:nth-child(3), body[data-panel="3"] .sb-dots i:nth-child(4),
body[data-panel="4"] .sb-dots i:nth-child(5){height:3.4rem;background:#fff}
body:not(.has-tr) .sb-dots i:nth-child(5){display:none}

/* 세로: 위젯을 넓고 낮게 (정보 카드 4장 한 줄, 공기·해 카드 3장 한 줄) 해서 남는 높이를 시계에 줌 */
@media (orientation: portrait){
  body.sb .stage{

  body.sb .wmain, body.sb .hourly, body.sb .wave, body.sb .cards, body.sb .transit{align-self:end;margin:0}

  body.sb .h-plot{height:8rem;margin-top:1.6rem}
  body.sb .h-bars{margin-top:1.6rem}
  body.sb .bar{height:3.4rem}
  body.sb .cards{grid-template-columns:1fr 1fr 1.5fr}
  body.sb .sun-card{grid-column:auto;display:flex;align-items:stretch}
  body.sb .sun-times{display:flex;font-size:2.6rem}
  body.sb .sun-times b{font-size:3.8rem}
  body.sb .sun-times div:last-child{order:0}
  body.sb .sun-arc{order:0;margin-top:-1rem}
  /* 위젯 위치 점: 아래 가운데 가로로 */
  body.sb .sb-dots{top:auto;bottom:3rem;right:auto;left:50%;transform:translateX(-50%);flex-direction:row}
  body[data-panel="0"] .sb-dots i:nth-child(1), body[data-panel="1"] .sb-dots i:nth-child(2),
  body[data-panel="2"] .sb-dots i:nth-child(3), body[data-panel="3"] .sb-dots i:nth-child(4),
  body[data-panel="4"] .sb-dots i:nth-child(5){width:3.4rem;height:1.2rem}
}

/* 폰(OLED): 번인 방지로 JS가 1분마다 화면 전체를 몇 px씩 옮김 */

body.sb.phone.night .stage{opacity:.8;filter:grayscale(1)}
body.sb.phone::after{content:'';position:fixed;inset:0;background:#fff;mix-blend-mode:multiply;pointer-events:none;transition:background 3s}
body.sb.phone.night::after{background:#ff3b30}

/* ── 설정: 화면을 두 번 탭(PC는 더블클릭)하면 열림. 기기마다 저장 ── */
.settings{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(0,0,0,.72)}
.settings[hidden]{display:none}
.set-card{width:min(80rem, 92vw);max-height:94vh;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:3rem;padding:4.4rem;border:1px solid var(--card-bd);border-radius:3.2rem;background:#111}

/* 교통 등록: 등록 목록 / 검색창 / 결과(정류장 → 노선 체크, 또는 지하철 방면) */
.tr-sec{display:flex;flex-direction:column;gap:1.8rem}

.tr-msg{font-size:2.6rem;line-height:1.5;color:var(--text-dim)}
.tr-msg:empty{display:none}
.set-card .tr-save{padding:1.6rem;border-radius:2rem;background:#fff;color:#000;font-weight:700}
</style>

<script>
// ===== 설정 =====
// 위치: 기본은 기기 위치(처음 한 번 위치 권한 허용). 주소에 좌표를 주면 그 위치로 고정
//   index.html?lat=35.1796&lon=129.0756&name=부산
// mode=detail: 처음 화면을 상세 화면으로 (설정 화면에서 바꾸면 그 설정이 우선)
// 시계 형식·시계 강조·날씨 넘김 주기는 화면을 두 번 탭하면 나오는 설정에서 바꿈
const params = new URLSearchParams(location.search);
const MANUAL_LOC = params.has('lat') && params.has('lon');
const CONFIG = {
  lat: parseFloat(params.get('lat')) || 37.5034,   // 위치를 모를 때 기본: 부천시청
  lon: parseFloat(params.get('lon')) || 126.7660,
  name: params.get('name') || '부천',
  weatherEvery: 15 * 60 * 1000,   // 날씨 갱신 주기
  airEvery: 30 * 60 * 1000,       // 미세먼지 갱신 주기
  phraseEvery: 30 * 1000,         // 문구 교체 주기
  hourlyCount: 12,                // 시간별 예보 칸 수 (지금부터 1시간 간격)
  standbyHours: 6,                // 시계 강조 화면은 칸이 커서 6시간만
  cursorIdle: 3 * 1000,           // 마우스가 이만큼 멈춰 있으면 커서 숨김
  nightStart: 23, nightEnd: 6,    // 이 시간대엔 화면을 어둡게
  reloadHour: 4                   // 매일 이 시각에 페이지 새로고침
};

const $ = id => document.getElementById(id);
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const range = (n, f = String) => Array.from({ length: n }, (_, i) => f(i));

// ===== 사용자 설정 (설정 화면에서 바꿈, 기기마다 저장) =====
// hour12: 12시간제 / focus: 시계 강조 화면(끄면 상세 화면) / rotate: 날씨 위젯 자동 넘김(초)
// transit: 등록한 버스 정류장·지하철역 (교통 위젯)
const SET_KEY = 'mirror_settings';
const S = Object.assign(
  { hour12: false, focus: !['detail', 'mirror'].includes(params.get('mode')), rotate: 10, transit: [],
    alarm: { on: false, h: 7, m: 0 } },
  (() => { try { return JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch (e) { return {}; } })()
);
function saveSettings() {
  try { localStorage.setItem(SET_KEY, JSON.stringify(S)); } catch (e) {}
}

const state = { weather: null, air: null, weatherAt: 0, weatherErr: false, airErr: false };

// ===== 숫자 롤러 =====
// 띠 구성: [마지막값, ...values, 첫값, 둘째값] — 위아래로 이웃 숫자가 보이고,
// 마지막값→첫값(59→00 등)도 거꾸로 감기지 않고 한 칸 위로 굴러가도록 앞뒤에 여분을 둠
// fitWidth: 칸 폭을 현재 숫자 폭에 맞춤 (시/분 숫자용)
function roller(el, values, fitWidth) {
  const n = values.length;
  const strip = document.createElement('span');
  strip.className = 'strip';
  strip.innerHTML = [values[n - 1], ...values, values[0], values[1 % n]].map(v => `<span>${v}</span>`).join('');
  el.appendChild(strip);
  let idx = -1;
  const setWidth = () => {
    if (fitWidth && digitW && idx >= 0) el.style.width = digitW[values[idx]] + 'em';
  };
  const set = v => {
    const next = values.indexOf(v);
    if (next === idx) return;
    const wrap = idx === n - 1 && next === 0;
    const step = idx >= 0 && (next === idx + 1 || wrap);
    strip.style.transition = step ? '' : 'none';
    strip.style.setProperty('--p', wrap ? n + 1 : next + 1);
    if (wrap) {
      strip.addEventListener('transitionend', () => {
        strip.style.transition = 'none';
        strip.style.setProperty('--p', 1);
      }, { once: true });
    }
    idx = next;
    setWidth();
  };
  set.refresh = setWidth;
  return set;
}

// 숫자별 글자 폭(em). 너무 좁으면 굴러갈 때 이웃 숫자가 많이 잘려서 최소 .62em
let digitW = null;
function measureDigits() {
  const c = document.createElement('canvas').getContext('2d');
  c.font = '900 100px Orbitron';
  digitW = {};
  for (let i = 0; i < 10; i++) digitW[i] = Math.max(c.measureText(String(i)).width / 100, .62);
}

// 시 첫 자리: 24시간제 0~2, 12시간제 0~1 (1~9시는 앞에 0을 붙여 두 자리. 형식을 바꾸면 다시 만듦)
let setH1;
function setupH1() {
  $('h1').textContent = '';
  setH1 = roller($('h1'), range(S.hour12 ? 2 : 3), true);
}
setupH1();
const setH2 = roller($('h2'), range(10), true);
const setM1 = roller($('m1'), range(6), true);
const setM2 = roller($('m2'), range(10), true);
const setS = roller($('s'), range(60, pad));

// 날씨 위젯 4개 + 교통 위젯 (시계 강조 화면에서 같은 자리에 겹쳐 돌아감)
const PANELS = ['.wmain', '#hourly', '#wave', '.cards', '#transit'].map(s => document.querySelector(s));

// 시계 글자 크기 계산 (폰트 로드·화면 회전·날씨 표시 때마다 다시 맞춤)
// 가장 넓은 시각(예: 00:00) 기준이라 분마다 크기가 바뀌지 않음
function fitClock() {
  const inner = $('clock-in');
  const fs = parseFloat(getComputedStyle(inner).fontSize);
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const wmax = digitW ? Math.max(...Object.values(digitW)) : .834;
  let size;
  if (document.body.classList.contains('sb')) {
    // 시계 강조: 시 / 분 / 초 3줄. 칸 폭(라벨 + 두 자리)과 남는 높이 중 작은 쪽에 맞춤
    // 높이(em) = 시 .82 + 분 .82 + 초 .41 + 줄 간격 .04×2 + 초 위 여백 .12
    const stage = $('stage'), st = getComputedStyle(stage);
    // 날짜는 시계 옆에 있어서 높이는 안 씀
    const portrait = innerHeight > innerWidth;
    let h = stage.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom)
      - parseFloat(getComputedStyle($('clock')).paddingBottom);
    if (portrait) h -= Math.max(...PANELS.map(el => el.offsetHeight)) + 4 * rem;   // 아래 위젯 자리
    // 폭: 세로는 전체 폭, 가로는 위젯 자리(최소 58rem + 여백 4rem)를 남긴 폭. 여기서 라벨과 오른쪽 날짜 칸을 뺌
    const w = portrait ? $('clock').clientWidth
      : stage.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight)
        - parseFloat(st.columnGap) - 62 * rem;
    const gap = parseFloat(getComputedStyle(inner).columnGap);
    const lbl = $('lbl-h').offsetWidth + gap;
    const side = document.querySelector('.ds').offsetWidth + gap + 3 * rem;
    size = Math.min((w - lbl - side) / (2 * wmax + .02), h / 2.25);
    // 가로: 시계 칸 폭을 가장 넓은 시각 기준으로 고정 → 분이 바뀌어 숫자 폭이 달라도 날짜·위젯이 안 움직임
    $('clock').style.width = portrait ? '' : (lbl + (2 * wmax + .02) * size * .99 + side) + 'px';
  } else {
    $('clock').style.width = '';
    const widestEm = 4 * wmax + ($('colon').getBoundingClientRect().width + $('sgroup').getBoundingClientRect().width) / fs + .1;
    size = $('clock').clientWidth / widestEm;
  }
  // 시계 칸(섹션)에 걸어서 스톱워치·타이머·알람 화면도 같은 크기를 씀
  $('clock').style.setProperty('--clock', (size / rem * .99) + 'rem');
  $('clock').style.setProperty('--dw', wmax + 'em');
}

// ===== 시계 =====
function isNight(h) {
  const s = CONFIG.nightStart, e = CONFIG.nightEnd;
  return s > e ? (h >= s || h < e) : (h >= s && h < e);
}

function renderClock(d) {
  const h = d.getHours();
  const hh = pad(S.hour12 ? h % 12 || 12 : h), mm = pad(d.getMinutes());
  setH1(hh[0]); setH2(hh[1]); setM1(mm[0]); setM2(mm[1]);
  setS(pad(d.getSeconds()));
  const lbl = S.hour12 ? `hours · ${h < 12 ? 'am' : 'pm'}` : 'hours';
  if ($('lbl-h').textContent !== lbl) $('lbl-h').textContent = lbl;
  renderDate(d);
}

// 날짜: 상세 화면은 10.27 / 2026 · 화요일, 시계 강조 화면은 눕혀서 2026년 10월 27일 … 화요일
// 토요일 하늘색, 일요일·공휴일 핑크 (공휴일이면 이름도)
function renderDate(d) {
  const iso = ymd(d);
  if ($('date').dataset.iso === iso) return;
  $('date').dataset.iso = iso;
  const wd = WEEK[d.getDay()] + '요일', hol = holidayName(iso);
  $('date-num').textContent = `${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  $('date-year').textContent = d.getFullYear();
  $('date-wd').textContent = hol ? `${wd} · ${hol}` : wd;
  $('ds-date').innerHTML = `<b>${d.getFullYear()}</b>년<b>${d.getMonth() + 1}</b>월<b>${d.getDate()}</b>일`;
  $('ds-wd').textContent = wd;
  $('ds-hol').textContent = hol;
  document.body.dataset.day = hol || d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : '';
}

function tickClock() {
  const d = new Date();
  renderClock(d);
  if (d.getSeconds() === 0) {
    if (d.getMinutes() === 0) renderWeather();   // 정각마다 시간별 예보 첫 칸을 '지금'으로 당김
    else renderSun();
    shiftPixels(d.getMinutes());
  }
  checkAlarm(d);
  cmIdleCheck();
  document.body.classList.toggle('night', isNight(d.getHours()));
  setTimeout(tickClock, 1000 - d.getMilliseconds() + 5);
}

// ===== 아이콘 =====
const CLOUD_BASE = '<path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>';
const ICONS = {
  sun: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  smallSun: '<circle cx="8" cy="8" r="3.2"/><path d="M8 2.2v1.3M2.2 8h1.3M3.9 3.9l.9.9M12.1 3.9l-.9.9M3.9 12.1l.9-.9"/>',
  smallMoon: '<path d="M11.5 8.4A4.5 4.5 0 1 1 6.6 3.5a3.5 3.5 0 0 0 4.9 4.9z"/>',
  frontCloud: '<path class="occ" d="M18.5 12.5h-.95A6.2 6.2 0 1 0 11.6 20.5h6.9a4 4 0 0 0 0-8z"/>',
  cloud: '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>',
  fog: '<path d="M7 6h10M3 10h18M5 14h14M3 18h18"/>',
  drizzle: CLOUD_BASE + '<path d="M8 13v2M8 19v2M12 15v2M12 21v2M16 13v2M16 19v2"/>',
  rain: CLOUD_BASE + '<path d="M8 13v8M12 15v8M16 13v8"/>',
  snow: CLOUD_BASE + '<path class="dots" d="M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/>',
  thunder: '<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><path d="M13 11l-4 6h6l-4 6"/>'
};

function icon(kind, day = true) {
  let body;
  if (kind === 'clear') body = day ? ICONS.sun : ICONS.moon;
  else if (kind === 'partly') body = (day ? ICONS.smallSun : ICONS.smallMoon) + ICONS.frontCloud;
  else body = ICONS[kind] || ICONS.cloud;
  return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
}

// WMO 날씨 코드 → [설명, 아이콘 종류]
const WMO = {
  0: ['맑음', 'clear'], 1: ['대체로 맑음', 'partly'], 2: ['구름 조금', 'partly'], 3: ['흐림', 'cloud'],
  45: ['안개', 'fog'], 48: ['안개', 'fog'],
  51: ['약한 이슬비', 'drizzle'], 53: ['이슬비', 'drizzle'], 55: ['강한 이슬비', 'drizzle'],
  56: ['어는 이슬비', 'drizzle'], 57: ['어는 이슬비', 'drizzle'],
  61: ['약한 비', 'rain'], 63: ['비', 'rain'], 65: ['강한 비', 'rain'], 66: ['어는 비', 'rain'], 67: ['어는 비', 'rain'],
  71: ['약한 눈', 'snow'], 73: ['눈', 'snow'], 75: ['많은 눈', 'snow'], 77: ['싸락눈', 'snow'],
  80: ['소나기', 'rain'], 81: ['소나기', 'rain'], 82: ['강한 소나기', 'rain'],
  85: ['소낙눈', 'snow'], 86: ['강한 소낙눈', 'snow'],
  95: ['뇌우', 'thunder'], 96: ['우박 뇌우', 'thunder'], 99: ['우박 뇌우', 'thunder']
};
const wmo = code => WMO[code] || ['-', 'cloud'];

// ===== 데이터 =====
async function getJSON(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

// 새로고침 직후에도 바로 보이도록 마지막 응답을 저장 (실패해도 동작엔 지장 없음)
const cacheKey = key => `mirror3_${key}_${CONFIG.lat}_${CONFIG.lon}`;   // 응답 형식이 바뀌면 접두어 버전을 올릴 것
function save(key, data) {
  try { localStorage.setItem(cacheKey(key), JSON.stringify({ at: Date.now(), data })); } catch (e) {}
}
function load(key, maxAge) {
  try {
    const v = JSON.parse(localStorage.getItem(cacheKey(key)));
    if (v && Date.now() - v.at < maxAge) return v;
  } catch (e) {}
  return null;
}

// 요청하는 사이 위치가 바뀌었으면(기기 위치 확인 직후) 늦게 온 이전 위치 응답은 버림
const sameLoc = ({ lat, lon }) => lat === CONFIG.lat && lon === CONFIG.lon;

async function loadWeather() {
  const at = { lat: CONFIG.lat, lon: CONFIG.lon };
  const url = 'https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({
    latitude: at.lat, longitude: at.lon, timezone: 'auto', past_days: 1, forecast_days: 6,
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,uv_index',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset',
    hourly: 'temperature_2m,weather_code,precipitation_probability,is_day'
  });
  try {
    const data = await getJSON(url);
    if (!sameLoc(at)) return;
    state.weather = data;
    state.weatherAt = Date.now();
    state.weatherErr = false;
    save('weather', state.weather);
  } catch (e) {
    state.weatherErr = true;
    console.warn('날씨 갱신 실패', e);
  }
  renderWeather();
  renderFoot();
}

// 미세먼지: 에어코리아 실측(같은 사이트의 /api/air 중계)을 먼저, 안 되면 Open-Meteo 예측값
// (키 설정 전·파일로 열었을 때·측정소 점검 중에도 화면엔 항상 값이 나옴)
// state.air = { pm10, pm25, station(실측일 때 측정소 이름) }
async function loadAir() {
  const at = { lat: CONFIG.lat, lon: CONFIG.lon };
  let air = null;
  try {
    const r = await getJSON('/api/air?' + new URLSearchParams({ lat: at.lat, lon: at.lon }));
    if (r.pm10 != null || r.pm25 != null) air = { pm10: r.pm10, pm25: r.pm25, station: r.station };
  } catch (e) {}
  try {
    if (!air) {
      const r = await getJSON('https://air-quality-api.open-meteo.com/v1/air-quality?' + new URLSearchParams({
        latitude: at.lat, longitude: at.lon, timezone: 'auto', current: 'pm10,pm2_5'
      }));
      air = { pm10: r.current.pm10, pm25: r.current.pm2_5 };
    }
    if (!sameLoc(at)) return;
    state.air = air;
    state.airErr = false;
    save('air2', state.air);
  } catch (e) {
    state.airErr = true;
    console.warn('미세먼지 갱신 실패', e);
  }
  renderAir();
  renderFoot();
}

// ===== 위치 =====
// 기기 위치 → '구 + 동' 이름(OpenStreetMap)으로 바꿔 저장. 실패하면 마지막 위치, 그것도 없으면 서울
// 날씨 API엔 소수 둘째 자리(약 1km), 동 이름 조회엔 셋째 자리(약 100m)까지만 보냄
// (1km로 반올림하면 이웃 동이 나오는 경우가 있음)
const LOC_KEY = 'mirror_loc';
const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;
const FALLBACK_NAME = '내 위치';

function savedLoc() {
  try { return JSON.parse(localStorage.getItem(LOC_KEY)); } catch (e) { return null; }
}
function useLoc(loc) {
  CONFIG.lat = loc.lat; CONFIG.lon = loc.lon; CONFIG.name = loc.name;
}

// 예: 강남구 역삼1동, 분당구 정자동, 양평군 양평읍, 제주시 이도2동
// 동 이름이 담기는 항목이 지역마다 달라서('분당'처럼 동이 아닌 값도 있음) 동·읍·면·가·리로 끝나는 첫 값을 씀
// (시골은 읍·면 없이 '양근리' 같은 리만 오기도 함)
async function placeName(lat, lon) {
  const r = await getJSON('https://nominatim.openstreetmap.org/reverse?' + new URLSearchParams({
    format: 'jsonv2', lat, lon, zoom: 16, 'accept-language': 'ko'
  }));
  const a = r.address || {};
  const district = a.borough || a.county || (a.city || '').replace(/(특별시|광역시|특별자치시)$/, '');
  const dong = [a.suburb, a.city_district, a.quarter, a.town, a.village].find(v => /(동|읍|면|가|리)$/.test(v || ''));
  return [district, dong].filter(Boolean).join(' ') || FALLBACK_NAME;
}

function locate() {
  if (MANUAL_LOC || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude } = pos.coords;
    const fine = [round(latitude, 3), round(longitude, 3)];
    const prev = savedLoc();
    if (prev && String(prev.fine) === String(fine) && prev.name !== FALLBACK_NAME) return;
    let name = FALLBACK_NAME;
    try { name = await placeName(...fine); } catch (e) { console.warn('지역 이름 확인 실패', e); }
    const loc = { lat: round(latitude, 2), lon: round(longitude, 2), fine, name };
    try { localStorage.setItem(LOC_KEY, JSON.stringify(loc)); } catch (e) {}
    const moved = !sameLoc(loc);
    useLoc(loc);
    if (moved) { loadWeather(); loadAir(); }
    else renderFoot();
  }, err => console.warn('위치 확인 실패', err.message), { timeout: 20000, maximumAge: 6 * 3600e3 });
}

// ===== 렌더링 =====
// 오늘 이후 4일치 예보 인덱스
function upcomingDays(w) {
  const today = ymd(new Date());
  return w.daily.time.map((t, i) => [t, i]).filter(([t]) => t >= today).slice(0, 4);
}

// 예보 곡선용: 어제부터 6일
function waveDays(w) {
  const t = w.daily.time, start = Math.max(0, t.indexOf(ymd(new Date())) - 1);
  return t.slice(start, start + 6).map((iso, k) => [iso, start + k]);
}

function dayLabel(iso) {
  const now = new Date();
  const rel = k => ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate() + k));
  if (iso === rel(0)) return '오늘';
  if (iso === rel(1)) return '내일';
  if (iso === rel(-1)) return '어제';
  const [y, m, d] = iso.split('-').map(Number);
  return WEEK[new Date(y, m - 1, d).getDay()];
}

// 기온 → 색 (추우면 파랑, 더우면 주황)
const TEMP_STOPS = [[-10, [111, 168, 255]], [0, [142, 197, 255]], [10, [185, 224, 201]], [18, [255, 224, 138]], [25, [255, 179, 92]], [32, [255, 122, 69]]];
function tempColor(t) {
  const s = TEMP_STOPS;
  if (t <= s[0][0]) return `rgb(${s[0][1]})`;
  for (let k = 1; k < s.length; k++) {
    if (t <= s[k][0]) {
      const f = (t - s[k - 1][0]) / (s[k][0] - s[k - 1][0]);
      return `rgb(${s[k - 1][1].map((v, j) => Math.round(v + (s[k][1][j] - v) * f))})`;
    }
  }
  return `rgb(${s[s.length - 1][1]})`;
}

// 점들을 지나는 부드러운 곡선 (Catmull-Rom → 베지어)
function smoothPath(p) {
  const f = v => v.toFixed(1);
  let s = `M${f(p[0][0])},${f(p[0][1])}`;
  for (let k = 0; k < p.length - 1; k++) {
    const p0 = p[k - 1] || p[k], p1 = p[k], p2 = p[k + 1], p3 = p[k + 2] || p2;
    s += ` C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)}`
       + ` ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
  }
  return s;
}

function renderWeather() {
  const w = state.weather;
  if (!w) return;
  const c = w.current, d = w.daily;
  const [desc, kind] = wmo(c.weather_code);
  const today = upcomingDays(w)[0];
  $('w-ico').innerHTML = icon(kind, c.is_day === 1);
  $('w-title').textContent = desc;
  $('w-feel').textContent = `체감 ${Math.round(c.apparent_temperature)}°`;
  $('w-temp').textContent = Math.round(c.temperature_2m) + '°';
  if (today) {
    const i = today[1];
    $('w-hi').textContent = Math.round(d.temperature_2m_max[i]) + '°';
    $('w-lo').textContent = Math.round(d.temperature_2m_min[i]) + '°';
    const [hiAt, loAt] = extremeHours(w, today[0]);
    $('w-hi-t').textContent = hiAt;
    $('w-lo-t').textContent = loAt;
    // 어제 최고기온과 비교 (past_days=1로 어제 값이 함께 옴)
    const diff = i > 0 ? Math.round(d.temperature_2m_max[i] - d.temperature_2m_max[i - 1]) : null;
    $('w-diff').textContent = diff == null ? '' : diff === 0 ? '어제와 비슷한 기온이에요'
      : `어제보다 ${Math.abs(diff)}° ${diff > 0 ? '높아요' : '낮아요'}`;
  }
  $('w-hum').textContent = c.relative_humidity_2m + '%';
  $('w-hum-t').textContent = humLevel(c.relative_humidity_2m);
  const [uvText, uvCls] = c.uv_index == null ? ['', ''] : uvLevel(c.uv_index);
  $('w-uv').textContent = c.uv_index == null ? '-' : Math.round(c.uv_index);
  $('w-uv-t').textContent = uvText;
  $('w-uv-t').className = 'c-sub ' + uvCls;
  renderHourly(w);
  renderWave(w);
  renderSun();
  fitClock();   // 세로 시계 강조 화면은 위젯 높이에 따라 시계 크기가 정해짐
}

// 자외선 지수 단계 (기상청 기준) → [단계, 등급색]
const uvLevel = v => v < 3 ? ['낮음', 'good'] : v < 6 ? ['보통', 'normal'] : v < 8 ? ['높음', 'bad'] : v < 11 ? ['매우높음', 'worst'] : ['위험', 'worst'];
const humLevel = v => v < 30 ? '건조' : v <= 60 ? '쾌적' : v <= 80 ? '습함' : '매우 습함';

// 오늘 최고·최저 기온이 나타나는 시각 (시간별 예보 기준)
function extremeHours(w, iso) {
  const h = w.hourly;
  if (!h) return ['', ''];
  const idx = h.time.map((t, i) => [t, i]).filter(([t]) => t.startsWith(iso)).map(([, i]) => i);
  if (!idx.length) return ['', ''];
  const pick = better => idx.reduce((a, b) => better(h.temperature_2m[b], h.temperature_2m[a]) ? b : a);
  const label = i => {
    const hr = Number(h.time[i].slice(11, 13));
    return `${hr < 12 ? '오전' : '오후'} ${hr % 12 || 12}시`;
  };
  return [label(pick((x, y) => x > y)), label(pick((x, y) => x < y))];
}

function renderWave(w) {
  const d = w.daily, today = ymd(new Date());
  const days = waveDays(w), n = days.length;
  if (!n) return;
  const temps = days.map(([, i]) => d.temperature_2m_max[i]);
  const lo = Math.min(...temps), hi = Math.max(...temps);
  const PAD = 25;   // 동그란 점이 위아래로 잘리지 않도록 남기는 여백 (viewBox 100 기준)
  const pts = temps.map((t, k) => [(k + .5) / n * 600, hi === lo ? 50 : PAD + (hi - t) / (hi - lo) * (100 - 2 * PAD)]);
  $('wave-path').setAttribute('d', smoothPath([[0, pts[0][1]], ...pts, [600, pts[n - 1][1]]]));
  $('wave').style.setProperty('--n', n);

  let top = '', nodes = '', pop = '';
  days.forEach(([iso, i], k) => {
    const cls = iso < today ? 'past' : iso === today ? 'today' : '';
    const max = Math.round(d.temperature_2m_max[i]);
    const color = cls ? '' : ` style="color:${tempColor(max)}"`;
    top += `<div class="wt ${cls}"><span class="wd">${dayLabel(iso)}</span>`
         + `<b${color}>${max}°<small>${Math.round(d.temperature_2m_min[i])}°</small></b></div>`;
    const x = (pts[k][0] / 6).toFixed(2), y = pts[k][1].toFixed(2);
    nodes += cls === 'today'
      ? `<i class="wave-line" style="left:${x}%;height:calc(${y}% + 1.2rem)"></i><i class="wave-dot" style="left:${x}%;top:${y}%"></i>`
      : `<span class="node ${cls}" style="left:${x}%;top:${y}%">${icon(wmo(d.weather_code[i])[1])}</span>`;
    const p = d.precipitation_probability_max[i];
    pop += `<span class="wp">${p >= 30 ? '☂ ' + p + '%' : ''}</span>`;
  });
  $('wave-top').innerHTML = top;
  $('wave-nodes').innerHTML = nodes;
  $('wave-pop').innerHTML = pop;
}

// 지금 시각부터 1시간 간격 예보. 첫 칸('지금')은 현재 관측값을 씀
function renderHourly(w) {
  const h = w.hourly;
  if (!h) return;
  const now = new Date();
  const i0 = h.time.indexOf(`${ymd(now)}T${pad(now.getHours())}:00`);
  if (i0 < 0) return;
  const count = document.body.classList.contains('sb') ? CONFIG.standbyHours : CONFIG.hourlyCount;
  const idx = range(Math.min(count, h.time.length - i0), k => i0 + k);
  const n = idx.length;
  const temps = idx.map((i, k) => k === 0 ? w.current.temperature_2m : h.temperature_2m[i]);
  const lo = Math.min(...temps), hi = Math.max(...temps);
  const PAD = 15;
  const pts = temps.map((t, k) => [(k + .5) / n * 600, hi === lo ? 50 : PAD + (hi - t) / (hi - lo) * (100 - 2 * PAD)]);
  const line = smoothPath([[0, pts[0][1]], ...pts, [600, pts[n - 1][1]]]);
  $('h-line').setAttribute('d', line);
  $('h-area').setAttribute('d', line + ' L600,100 L0,100 Z');
  $('hourly').style.setProperty('--n', n);

  let top = '', dots = '', bars = '';
  idx.forEach((i, k) => {
    const first = k === 0;
    const code = first ? w.current.weather_code : h.weather_code[i];
    const day = (first ? w.current.is_day : h.is_day[i]) === 1;
    top += `<div class="ht${first ? ' now' : ''}"><span class="hl">${first ? '지금' : Number(h.time[i].slice(11, 13)) + '시'}</span>`
         + `${icon(wmo(code)[1], day)}<b>${Math.round(temps[k])}°</b></div>`;
    dots += `<i class="h-dot${first ? ' now' : ''}" style="left:${(pts[k][0] / 6).toFixed(2)}%;top:${pts[k][1].toFixed(2)}%"></i>`;
    const p = h.precipitation_probability[i] || 0;
    bars += `<div class="hb"><span class="bar${p < 30 ? ' dry' : ''}"><i style="height:${Math.max(p, 8)}%"></i></span>`
          + `<span>${p >= 30 ? p + '%' : ''}</span></div>`;
  });
  $('h-top').innerHTML = top;
  $('h-dots').innerHTML = dots;
  $('h-bars').innerHTML = bars;
}

// ===== 달 =====
// 기준 삭(2000-01-06 18:14 UTC)부터 지난 시간 ÷ 평균 삭망월(29.53일) → 위상 0(삭) ~ .5(보름) ~ 1 (오차 반나절 안팎)
const moonPhase = t => (((t - Date.UTC(2000, 0, 6, 18, 14)) / 864e5 / 29.530588853) % 1 + 1) % 1;
// 위상 구간 → 이름 (보름달은 밝기 약 98% 이상)
const MOON_NAMES = [[.03, '삭'], [.22, '초승달'], [.28, '상현달'], [.45, '차오르는 달'], [.55, '보름달'],
  [.72, '기우는 달'], [.78, '하현달'], [.97, '그믐달'], [1, '삭']];
// 밝은 부분 = 밝은 쪽 반원(차는 달은 오른쪽, 기우는 달은 왼쪽) + 명암 경계 반타원
// (초승·그믐은 경계가 밝은 쪽으로 오목, 차오르는·기우는 달은 반대쪽으로 볼록)
function moonPath(p, r = 10) {
  const c = Math.cos(2 * Math.PI * p), waxing = p < .5;
  return `M0 ${-r}A${r} ${r} 0 0 ${waxing ? 1 : 0} 0 ${r}`
       + `A${(Math.abs(c) * r).toFixed(2)} ${r} 0 0 ${(c > 0) === waxing ? 0 : 1} 0 ${-r}Z`;
}
function renderMoon() {
  const p = moonPhase(Date.now());
  $('moon-lit').setAttribute('d', moonPath(p));
  $('moon-name').textContent = MOON_NAMES.find(([lim]) => p < lim)[1];
  $('moon-pct').textContent = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100) + '%';
}

// 일출~일몰 반원 위에 현재 해 위치 표시 (달 모양도 함께)
function renderSun() {
  renderMoon();
  const w = state.weather;
  const today = w && w.daily.sunrise && upcomingDays(w)[0];
  if (!today) return;
  const rise = w.daily.sunrise[today[1]], set = w.daily.sunset[today[1]];
  $('sunrise').textContent = rise.slice(11, 16);
  $('sunset').textContent = set.slice(11, 16);
  const f = (Date.now() - new Date(rise)) / (new Date(set) - new Date(rise));
  const th = Math.PI * (1 - Math.min(Math.max(f, 0), 1));
  const x = (50 + 42 * Math.cos(th)).toFixed(2), y = (48 - 42 * Math.sin(th)).toFixed(2);
  const up = f >= 0 && f <= 1;
  $('sun-dot').setAttribute('cx', up ? x : -10);
  $('sun-dot').setAttribute('cy', up ? y : -10);
  $('sun-done').setAttribute('d', f > 0 ? `M8 48A42 42 0 0 1 ${x} ${y}` : '');
}

// 환경부 기준 4단계 (좋음/보통/나쁨/매우나쁨)
const GRADES = [['좋음', 'good'], ['보통', 'normal'], ['나쁨', 'bad'], ['매우나쁨', 'worst']];
const gradePm10 = v => v <= 30 ? 0 : v <= 80 ? 1 : v <= 150 ? 2 : 3;
const gradePm25 = v => v <= 15 ? 0 : v <= 35 ? 1 : v <= 75 ? 2 : 3;

function setAq(id, v, gradeOf) {
  const [text, cls] = v == null ? ['-', ''] : GRADES[gradeOf(v)];
  $(id).textContent = text;
  $(id).className = 'c-sub ' + cls;
  $(id + '-v').textContent = v == null ? '-' : Math.round(v);
}

function renderAir() {
  const a = state.air;
  if (!a) return;
  setAq('pm10', a.pm10, gradePm10);
  setAq('pm25', a.pm25, gradePm25);
  PANELS[3].dataset.src = a.station ? `${a.station} 측정소` : '예측값';   // 시계 강조 'air' 위젯 제목
}

function renderFoot() {
  let s = CONFIG.name;
  if (state.weatherAt) {
    const d = new Date(state.weatherAt);
    s += ` · ${pad(d.getHours())}:${pad(d.getMinutes())} 갱신`;
  }
  if (state.weatherErr || state.airErr) s += ' · 연결 확인 중';
  $('foot').textContent = s;
  PANELS[0].dataset.loc = CONFIG.name;   // 시계 강조 화면은 상단 바가 없어서 'now' 위젯 제목에 위치 표시
}

// ===== 문구 =====
const PHRASES = {
  dawn: ['고요한 새벽이에요. 푹 자는 것도 실력이에요.', '아직 깜깜해요. 조금 더 쉬어도 괜찮아요.'],
  morning: ['좋은 아침이에요!', '물 한 잔으로 하루를 시작해 볼까요?', '오늘도 멋진 하루 보내세요.',
            '오늘 거울 속 모습, 꽤 괜찮은데요?', '천천히, 그래도 꾸준히.'],
  afternoon: ['점심은 맛있게 드셨나요?', '잠깐 일어나서 기지개 한 번 켜요.',
              '오후도 힘내요. 거의 다 왔어요.', '물 마실 시간이에요.'],
  evening: ['오늘 하루도 수고 많았어요.', '저녁 맛있게 드세요.',
            '오늘 잘한 일 하나만 떠올려 봐요.', '이제 좀 쉬어도 돼요.'],
  night: ['오늘도 잘 해냈어요. 푹 쉬어요.', '내일은 더 좋은 날이 될 거예요.', '휴대폰 내려놓고 일찍 자기, 도전!']
};
const timeSlot = h => h < 5 ? 'dawn' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : h < 22 ? 'evening' : 'night';

// 날씨·미세먼지·요일에 맞춘 문구
function contextual(now) {
  const out = [];
  const h = now.getHours(), wd = now.getDay();
  const w = state.weather;
  if (w) {
    const today = upcomingDays(w)[0];
    const nowKind = wmo(w.current.weather_code)[1];
    if (nowKind === 'rain' || nowKind === 'drizzle' || nowKind === 'thunder') out.push('지금 비가 오고 있어요. 우산 꼭 챙기세요.');
    else if (nowKind === 'snow') out.push('눈이 오고 있어요. 길 미끄러우니 조심하세요.');
    if (today && h < 20) {
      const i = today[1], d = w.daily;
      const kind = wmo(d.weather_code[i])[1];
      if (d.precipitation_probability_max[i] >= 60 && nowKind !== 'rain') {
        out.push(kind === 'snow' ? '오늘 눈 소식이 있어요. 따뜻하게 챙겨 입어요.' : '오늘 비 소식이 있어요. 우산 챙기세요.');
      }
      if (d.temperature_2m_min[i] <= 0) out.push('많이 추워요. 따뜻하게 입고 나가세요.');
      if (d.temperature_2m_max[i] >= 30) out.push('더운 날이에요. 물 자주 마셔요.');
      if (d.temperature_2m_max[i] - d.temperature_2m_min[i] >= 10) out.push('일교차가 커요. 겉옷 하나 챙기세요.');
    }
  }
  const a = state.air;
  if (a && a.pm10 != null && a.pm25 != null) {
    const g = Math.max(gradePm10(a.pm10), gradePm25(a.pm25));
    if (g >= 2) out.push('미세먼지가 나빠요. 마스크 챙기세요.');
    else if (g === 0 && h >= 8 && h < 18) out.push('공기가 맑아요. 환기하기 좋은 날이에요.');
  }
  if (wd === 1 && h < 12) out.push('한 주의 시작, 이번 주도 화이팅!');
  if (wd === 5 && h >= 17) out.push('불금이에요! 이번 주도 고생했어요.');
  if ((wd === 0 || wd === 6) && h >= 8 && h < 20) out.push('즐거운 주말 보내세요.');
  return out;
}

let phraseIdx = Math.floor(Math.random() * 100);
function nextPhrase(first) {
  const now = new Date();
  const list = [...contextual(now), ...PHRASES[timeSlot(now.getHours())]];
  const text = list[phraseIdx++ % list.length];
  const el = $('phrase');
  if (first) { el.textContent = text; return; }
  if (el.textContent === text) return;
  el.classList.add('fade');
  setTimeout(() => { el.textContent = text; el.classList.remove('fade'); }, 1200);
}

// ===== 화면 모드 =====
// 폰 크기 화면은 시계 강조 화면에 밤 붉은 화면·번인 방지가 더해짐
const phoneMQ = matchMedia('(max-width: 540px), (max-height: 540px)');
function applyMode() {

// 설정 반영: 화면 종류(시계 강조/상세), 시계 형식, 위젯 넘김 주기
function applySettings() {

  trRenderList();

// ===== 공휴일 =====
// 대체공휴일·선거일까지 들어 있는 공공데이터포털 기반 연도별 목록(holidays-kr). 못 받으면 양력 고정 공휴일만
const HOLIDAY_URL = y => `https://cdn.jsdelivr.net/gh/hyunbinseo/holidays-kr@main/public/${y}.json`;
const FIXED_HOLIDAYS = { '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일',
  '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절' };
const holidays = {}, holidayYears = new Set();
// '대체공휴일(3ㆍ1절)' → '대체공휴일', '1월 1일' → '신정'
const shortHoliday = n => n === '1월 1일' ? '신정' : n.replace(/\(.*\)/, '').trim();

function holidayName(iso) {
  const y = iso.slice(0, 4);
  if (!holidayYears.has(y)) { holidayYears.add(y); loadHolidays(y); }
  return holidays[iso] || FIXED_HOLIDAYS[iso.slice(5)] || '';
}

async function loadHolidays(y) {
  const key = 'mirror_holi_' + y;
  let data = null;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (c && Date.now() - c.at < 30 * 864e5) data = c.data;
  } catch (e) {}
  if (!data) {
    try { data = await getJSON(HOLIDAY_URL(y)); }
    catch (e) { console.warn('공휴일 목록 확인 실패', e); return; }
    try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), data })); } catch (e) {}
  }
  for (const [iso, names] of Object.entries(data)) holidays[iso] = shortHoliday(names[0]);
  delete $('date').dataset.iso;   // 날짜 다시 그림
  renderDate(new Date());
}

// ===== 날씨 위젯 넘기기 =====
// 시계 강조: 위젯 4개(교통 등록 시 5개)를 차례로 / 상세 세로: 시간별 ↔ 일별
// S.rotate초마다 자동, 화면을 밀면 바로 넘김
let panel = 0, panelTimer;
function showPanel(p) {
  const n = S.focus && S.transit.length ? 5 : 4;
  panel = (p + n) % n;
  document.body.dataset.panel = panel;
  document.body.classList.toggle('alt', panel % 2 === 1);
  if (panel === 4) { renderBoard(); if (Date.now() - boardAt > 50e3) loadBoard(); }
  clearTimeout(panelTimer);
  panelTimer = setTimeout(() => showPanel(panel + 1), S.rotate * 1000);
}

// ===== 터치 =====
// 밀기: 왼쪽·위로 밀면 다음, 오른쪽·아래로 밀면 이전
//   시계 쪽에서 밀면 시계 → 스톱워치 → 타이머 → 알람 (시계 강조 화면), 나머지는 날씨 위젯
// 두 번 탭(더블클릭): 설정 열기. 버튼을 누를 때는 둘 다 안 함
let touchStart = null, lastTap = 0;
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button') || !$('ring').hidden) { touchStart = null; return; }
  const r = $('clock').getBoundingClientRect();
  const inClock = S.focus && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  touchStart = { x: e.clientX, y: e.clientY, clock: inClock };
});
document.addEventListener('pointerup', e => {
  const s = touchStart;
  touchStart = null;
  if (!s || !$('settings').hidden) return;
  const dx = e.clientX - s.x, dy = e.clientY - s.y;
  if (Math.hypot(dx, dy) >= Math.min(innerWidth, innerHeight) * .08) {
    const dir = (Math.abs(dx) > Math.abs(dy) ? dx : dy) < 0 ? 1 : -1;
    if (s.clock) showCm(cm + dir);
    else showPanel(panel + dir);
    lastTap = 0;
  } else if (e.timeStamp - lastTap < 400) {
    openSettings();
    lastTap = 0;
  } else {
    lastTap = e.timeStamp;
  }
});

// ===== 시계 쪽 기능: 시계 → 스톱워치 → 타이머 → 알람 (시계 강조 화면에서 시계 쪽을 밀어서 넘김) =====
// 화면(앱)이 켜져 있어야 울림. 스톱워치·타이머는 새로고침하면 초기화, 알람 시각은 설정에 저장
const CM = ['clock', 'sw', 'tm', 'al'];
let cm = 0, cmAt = 0;
function showCm(i) {
  cm = (i + CM.length) % CM.length;
  document.body.dataset.cm = CM[cm];
  cmAt = Date.now();
  renderCm();
}
function renderCm() {
  if (CM[cm] === 'sw') { renderSw(); requestAnimationFrame(swLoop); }
  else if (CM[cm] === 'tm') renderTm();
  else if (CM[cm] === 'al') renderAl();
}
// 숫자마다 고정 폭 칸에 넣어서 빨리 바뀌어도 흔들리지 않게
const digits = (el, s) => { const h = [...s].map(c => `<i>${c}</i>`).join(''); if (el.innerHTML !== h) el.innerHTML = h; };

// 스톱워치: 분 / 초 / 1/100초
const sw = { from: 0, acc: 0, run: false };
const swTime = () => sw.acc + (sw.run ? performance.now() - sw.from : 0);
function renderSw() {
  const t = swTime();
  digits($('sw-m'), pad(Math.floor(t / 6e4)));
  digits($('sw-s'), pad(Math.floor(t / 1e3) % 60));
  digits($('sw-cs'), pad(Math.floor(t / 10) % 100));
  $('sw-go').textContent = sw.run ? '정지' : t ? '계속' : '시작';
  $('sw-go').classList.toggle('on', sw.run);
}
function swLoop() { if (sw.run && CM[cm] === 'sw') { renderSw(); requestAnimationFrame(swLoop); } }

// 타이머: 분·초를 +/−로 맞추고 시작. 끝나면 울림
const tm = { set: 300, left: 300, end: 0, run: false };   // 초
const tmLeft = () => tm.run ? Math.max(0, (tm.end - Date.now()) / 1e3) : tm.left;
function renderTm() {
  const t = Math.ceil(tmLeft());
  digits($('tm-m'), pad(Math.floor(t / 60)));
  digits($('tm-s'), pad(t % 60));
  $('tm-go').textContent = tm.run ? '정지' : tm.left < tm.set ? '계속' : '시작';
  $('tm-go').classList.toggle('on', tm.run);
}
setInterval(() => {
  if (!tm.run) return;
  if (tmLeft() <= 0) { tm.run = false; tm.left = tm.set; ring('타이머 끝'); }
  if (CM[cm] === 'tm') renderTm();
}, 250);

// 알람: 시·분을 +/−로 맞추고 켜기 (24시간 기준, 설정에 저장)
function renderAl() {
  digits($('al-h'), pad(S.alarm.h));
  digits($('al-m'), pad(S.alarm.m));
  $('al-go').textContent = S.alarm.on ? '켜짐' : '꺼짐';
  $('al-go').classList.toggle('on', S.alarm.on);
}
function checkAlarm(d) {
  if (S.alarm.on && d.getSeconds() === 0 && d.getHours() === S.alarm.h && d.getMinutes() === S.alarm.m) {
    ring(`알람 ${pad(S.alarm.h)}:${pad(S.alarm.m)}`);
  }
}

// 버튼: +/−는 누르고 있으면 빠르게 반복, 나머지는 한 번
function cmStep(b) {
  const d = b.dataset;
  if (d.tm && !isNaN(d.tm) && !tm.run) {
    tm.set = Math.min(99 * 60 + 59, Math.max(10, tm.set + Number(d.tm)));
    tm.left = tm.set;
    renderTm();
  } else if (d.al && !isNaN(d.al)) {
    const t = ((S.alarm.h * 60 + S.alarm.m + Number(d.al)) % 1440 + 1440) % 1440;
    S.alarm.h = Math.floor(t / 60); S.alarm.m = t % 60;
    saveSettings(); renderAl();
  }
}
let holdTimer;
$('clock').addEventListener('pointerdown', e => {
  const b = e.target.closest('.cm-pm button');
  if (!b) return;
  unlockSound();
  cmAt = Date.now();
  cmStep(b);
  holdTimer = setTimeout(function again() { cmStep(b); holdTimer = setTimeout(again, 90); }, 450);
});
document.addEventListener('pointerup', () => clearTimeout(holdTimer));
document.addEventListener('pointercancel', () => clearTimeout(holdTimer));
$('clock').addEventListener('click', e => {
  const b = e.target.closest('.cm-ctl button');
  if (!b) return;
  unlockSound();
  cmAt = Date.now();
  const d = b.dataset;
  if (d.sw === 'go') {
    if (sw.run) { sw.acc = swTime(); sw.run = false; } else { sw.from = performance.now(); sw.run = true; }
  } else if (d.sw === 'reset') { sw.run = false; sw.acc = 0; }
  else if (d.tm === 'go') {
    if (tm.run) { tm.left = tmLeft(); tm.run = false; } else { tm.end = Date.now() + tm.left * 1e3; tm.run = true; }
  } else if (d.tm === 'reset') { tm.run = false; tm.left = tm.set; }
  else if (d.al === 'toggle') { S.alarm.on = !S.alarm.on; saveSettings(); }
  renderCm();
});

// 울림: 소리(삐삐삐)·진동을 1.5초마다, 3분 동안. 아무 데나 누르면 끔
// 브라우저는 사람이 화면을 한 번 누른 뒤에만 소리를 내게 해서, 버튼을 누를 때 소리를 미리 켜 둠
let actx = null, ringTimer = null;
function unlockSound() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
}
function beep() {
  if (!actx) return;
  const t = actx.currentTime;
  [0, .22, .44].forEach(k => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(.0001, t + k);
    g.gain.exponentialRampToValueAtTime(.35, t + k + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + k + .18);
    o.connect(g).connect(actx.destination);
    o.start(t + k); o.stop(t + k + .2);
  });
}
function ring(title) {
  $('ring-title').textContent = title;
  $('ring').hidden = false;
  const until = Date.now() + 180e3;
  clearInterval(ringTimer);
  const once = () => {
    if (Date.now() > until) return stopRing();
    beep();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  };
  once();
  ringTimer = setInterval(once, 1500);
}
function stopRing() { clearInterval(ringTimer); $('ring').hidden = true; }
$('ring').addEventListener('click', stopRing);

// 시계가 아닌 화면에서 3분 동안 아무것도 안 하면(돌아가는 게 없으면) 시계로 돌아감
function cmIdleCheck() {
  if (cm && !sw.run && !tm.run && Date.now() - cmAt > 180e3) showCm(0);
}

// ===== 설정 화면 =====
let settingsAt = 0;
function openSettings() {
  $('settings').hidden = false;
  settingsAt = performance.now();
}
$('settings').addEventListener('click', e => {
  if (performance.now() - settingsAt < 500) return;   // 열 때의 두 번째 탭이 바로 닫지 않게
  const b = e.target.closest('button');
  if (b && b.parentNode.classList.contains('seg')) S[b.parentNode.dataset.key] = b.dataset.v === '1';
  else if (b && b.dataset.d) S.rotate = Math.min(120, Math.max(5, S.rotate + Number(b.dataset.d)));
  else {
    if (e.target === $('settings') || (b && b.classList.contains('set-close'))) $('settings').hidden = true;
    return;
  }
  saveSettings();
  applySettings();
});

// ===== 교통: 버스 정류장·지하철역 검색 등록 (설정 화면) + 도착 정보 위젯 =====
// 서버 중계 /api/transit (functions/api/transit.js). 등록 정보는 S.transit에 기기마다 저장
//   버스: { t:'bus', src:'gg'|'seoul', id, name, no, routes:[{ id, name }] }
//   지하철: { t:'sub', station, sid(노선 번호), updn(상행·하행 등), label('1호선 송내방면') }
const TR_API = '/api/transit';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const SRC_NAME = { gg: '경기', seoul: '서울' };
let trMode = null, trItems = [], trStop = null;

function trRenderList() {
  $('tr-list').innerHTML = S.transit.map((it, i) => it.t === 'bus'
    ? `<li><div>${esc(it.name)} <small>${SRC_NAME[it.src]} · ${esc(it.no)} · ${it.routes.map(r => esc(r.name)).join(', ')}</small></div><button data-del="${i}">삭제</button></li>`
    : `<li><div>${esc(it.station)}역 <small>${esc(it.label)}</small></div><button data-del="${i}">삭제</button></li>`).join('');
}

function trMsg(text) { $('tr-msg').textContent = text || ''; }
async function trCall(params) {
  const r = await fetch(TR_API + '?' + new URLSearchParams(params), { cache: 'no-store' });
  const data = await r.json().catch(() => ({ error: '교통 서버에 연결하지 못했어요' }));
  if (data.error) throw new Error(data.error);
  return data;
}
// 한쪽(경기/서울)만 실패한 경우 이유를 함께 보여줌
const trNote = (n, errors) => [n ? '' : '결과가 없어요.', ...(errors || [])].filter(Boolean).join(' / ');

function trShowStops(stops, errors) {
  trItems = stops;
  $('tr-res').innerHTML = stops.map((s, i) => `<li data-i="${i}"><div>${esc(s.name)}`
    + `<small>${SRC_NAME[s.src]} · ${esc(s.no || '번호 없음')}${s.dist != null ? ` · ${s.dist}m` : s.region ? ` · ${esc(s.region)}` : ''}</small></div></li>`).join('');
  trMsg(trNote(stops.length, errors));
}

async function trSearch() {
  const q = $('tr-q').value.trim();
  if (!q) return;
  trMsg('찾는 중…'); $('tr-res').innerHTML = ''; trStop = null;
  try {
    if (trMode === 'bus') {
      const r = await trCall({ op: 'search', q });
      trShowStops(r.stops, r.errors);
    } else {
      const r = await trCall({ op: 'subway-search', q });
      trItems = r.dirs;
      $('tr-res').innerHTML = r.dirs.map((d, i) => `<li data-i="${i}"><div>${esc(d.station)}역 ${esc(d.line)}<small>${esc(d.updn)} · ${esc(d.dir)}</small></div></li>`).join('');
      trMsg(r.dirs.length ? '' : '지금 운행 중인 열차가 없어서 방면을 못 찾았어요. 열차가 다니는 시간에 다시 검색해 주세요.');
    }
  } catch (e) { trMsg('검색 실패: ' + e.message); }
}

// 내 주변 정류장: 지금 위치를 한 번 더 정확히(약 10m) 받아서 찾음. 안 되면 저장된 위치
async function trNear() {
  trMsg('내 위치 확인 중…'); $('tr-res').innerHTML = ''; trStop = null;
  const pos = await new Promise(res => navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p => res([p.coords.latitude, p.coords.longitude]), () => res(null), { enableHighAccuracy: true, timeout: 10000 })
    : res(null));
  const [lat, lon] = pos || (savedLoc() && savedLoc().fine) || [CONFIG.lat, CONFIG.lon];
  trMsg('주변 정류장 찾는 중…');
  try {
    const r = await trCall({ op: 'near', lat: round(lat, 4), lon: round(lon, 4) });
    trShowStops(r.stops, r.errors);
  } catch (e) { trMsg('찾기 실패: ' + e.message); }
}

// 결과를 고름: 지하철은 바로 등록, 버스는 그 정류장의 노선을 골라 등록
async function trChoose(i) {
  const it = trItems[i];
  if (trMode === 'sub') {
    trAdd({ t: 'sub', station: it.station, sid: it.sid, updn: it.updn, label: `${it.line} ${it.dir}` });
    return;
  }
  trStop = it;
  trMsg('노선 불러오는 중…'); $('tr-res').innerHTML = '';
  try {
    const { routes } = await trCall({ op: 'routes', src: it.src, id: it.id });
    trItems = routes;
    $('tr-res').innerHTML = routes.map((r, k) => `<li><label><input type="checkbox" value="${k}"><div>${esc(r.name)}<small>${esc(r.dest)}</small></div></label></li>`).join('')
      + (routes.length ? '<li style="border:0;padding:0"><button class="tr-save" id="tr-save" style="flex:1">선택한 노선 등록</button></li>' : '');
    trMsg(routes.length ? `${it.name} — 볼 노선을 고르세요` : '이 정류장을 지나는 노선 정보가 없어요.');
  } catch (e) { trMsg('노선 불러오기 실패: ' + e.message); }
}

function trSaveRoutes() {
  const picked = [...$('tr-res').querySelectorAll('input:checked')].map(c => trItems[c.value]);
  if (!picked.length) { trMsg('노선을 하나 이상 고르세요'); return; }
  const s = trStop;
  trAdd({ t: 'bus', src: s.src, id: s.id, name: s.name, no: s.no, routes: picked.map(r => ({ id: r.id, name: r.name })) });
}

function trAdd(item) {
  S.transit.push(item);
  $('tr-find').hidden = true;
  trMsg('');
  saveSettings();
  applySettings();
  loadBoard();
}

$('tr-sec').addEventListener('click', e => {
  const b = e.target.closest('button, li[data-i]');
  if (!b) return;
  if (b.dataset.add) {
    trMode = b.dataset.add; trStop = null;
    $('tr-find').hidden = false;
    $('tr-near').hidden = trMode !== 'bus';
    $('tr-q').value = '';
    $('tr-q').placeholder = trMode === 'bus' ? '정류장 이름 (예: 부천시청)' : '역 이름 (예: 부천)';
    $('tr-res').innerHTML = ''; trMsg('');
    $('tr-q').focus();
  } else if (b.dataset.del != null) {
    S.transit.splice(Number(b.dataset.del), 1);
    saveSettings();
    applySettings();
  } else if (b.id === 'tr-go') trSearch();
  else if (b.id === 'tr-near') trNear();
  else if (b.id === 'tr-save') trSaveRoutes();
  else if (b.dataset.i != null) trChoose(Number(b.dataset.i));
});
$('tr-q').addEventListener('keydown', e => { if (e.key === 'Enter') trSearch(); });

// 도착 정보: 교통 위젯이 보일 때 50초 이상 지났으면 새로 받음 (서버도 30초 캐시)
// 받아 온 뒤 지난 시간만큼 남은 분을 줄여서 보여줌
let board = null, boardAt = 0, boardBusy = false;
async function loadBoard() {
  if (!S.transit.length || boardBusy) return;
  boardBusy = true;
  const bus = [...new Set(S.transit.filter(t => t.t === 'bus').map(t => `${t.src}:${t.id}`))].join(',');
  const sub = [...new Set(S.transit.filter(t => t.t === 'sub').map(t => t.station))].join(',');
  try {
    board = await trCall({ op: 'board', bus, sub });
    boardAt = Date.now();
  } catch (e) { console.warn('교통 정보 확인 실패', e); }
  boardBusy = false;
  renderBoard();
}

function renderBoard() {
  if (!S.transit.length) { $('tr-board').innerHTML = ''; return; }
  const past = (Date.now() - boardAt) / 6e4;
  const when = (min, text) => min == null ? esc(text || '-')
    : (m => m <= 0 ? '<em>곧 도착</em>' : `${m}분`)(Math.round(min - past));
  const times = list => list.length ? list.join(' · ') : '정보 없음';
  $('tr-board').innerHTML = S.transit.map(it => {
    if (it.t === 'bus') {
      const arr = (board && board.bus[`${it.src}:${it.id}`]) || [];
      const rows = it.routes.slice(0, 4).map(r => {
        const a = arr.find(x => x.routeId === r.id);
        const t = a ? [when(a.min1, a.msg1), ...(a.min2 != null || a.msg2 ? [when(a.min2, a.msg2)] : [])] : [];
        return `<div class="tr-row"><b>${esc(r.name)}</b><span>${times(t)}</span></div>`;
      }).join('');
      return `<div class="tr-item"><div class="tr-head">${esc(it.name)}<small>${esc(it.no)}</small></div>${rows}</div>`;
    }
    const arr = ((board && board.sub[it.station]) || []).filter(a => a.sid === it.sid && a.updn === it.updn).slice(0, 2);
    return `<div class="tr-item"><div class="tr-head">${esc(it.station)}역<small>${esc(it.label)}</small></div>`
      + `<div class="tr-row"><b>${esc(it.label.split(' ')[0])}</b><span>${times(arr.map(a => when(a.min, a.text) + (a.express ? '<small class="tr-x">급행</small>' : '')))}</span></div></div>`;
  }).join('') + (board ? '' : '<div class="tr-none">도착 정보를 불러오는 중</div>');
}

// OLED 번인 방지: 1분마다 화면 전체를 몇 px씩 옮김 (폰 시계 강조 화면에서만 CSS가 적용)
const SHIFT = [[0, 0], [3, 0], [3, 3], [0, 3], [-3, 3], [-3, 0], [-3, -3], [0, -3], [3, -3]];
function shiftPixels(m) {
  const [x, y] = SHIFT[m % SHIFT.length];
  $('stage').style.setProperty('--sx', x + 'px');
  $('stage').style.setProperty('--sy', y + 'px');
}

// ===== 커서 =====
let idleTimer;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), CONFIG.cursorIdle);
});

// ===== 화면 유지 / 자동 새로고침 =====
async function keepAwake() {
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') keepAwake();
});

function scheduleReload() {
  const now = new Date(), next = new Date(now);
  next.setHours(CONFIG.reloadHour, 0, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => location.reload(), next - now);
}

// ===== 시작 =====
(function init() {
  applyMode();
  applySettings();
  if (!MANUAL_LOC && savedLoc()) useLoc(savedLoc());
  const cw = load('weather', 3 * 3600e3);
  if (cw) { state.weather = cw.data; state.weatherAt = cw.at; }
  const ca = load('air2', 3 * 3600e3);
  if (ca) state.air = ca.data;
  renderWeather();
  renderAir();
  renderMoon();
  renderFoot();
  tickClock();
  nextPhrase(true);
  fitClock();
  document.fonts.ready.then(() => {
    measureDigits();
    [setH1, setH2, setM1, setM2].forEach(set => set.refresh());
    fitClock();
  });
  window.addEventListener('resize', fitClock);
  phoneMQ.addEventListener('change', applyMode);

  loadWeather();
  loadAir();
  loadBoard();
  locate();
  setInterval(loadWeather, CONFIG.weatherEvery);
  setInterval(loadAir, CONFIG.airEvery);
  setInterval(nextPhrase, CONFIG.phraseEvery);
  keepAwake();
  scheduleReload();
})();
</script>
